name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # releases + cosign bundle
  packages: write
  id-token: write # cosign keyless + provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      # P1: build + scan a local staging image FIRST; only push after it passes.
      # Previously the image was pushed to :version+:latest and *then* scanned,
      # publishing a vulnerable image before the gate could fail.
      - name: Build staging image (no push)
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          load: true
          tags: portcullis:release-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan (gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: portcullis:release-scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # P3: supply-chain provenance (SLSA via buildkit attestations).
          sbom: true
          provenance: mode=max
      # Ship-checklist: web is a separate artifact — version it with the API
      # so Helm `tag: ""` (Chart.AppVersion) resolves identically for both.
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://portcullis.yourdomain.com
          tags: |
            ghcr.io/${{ github.repository }}-web:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Sign images with cosign (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
