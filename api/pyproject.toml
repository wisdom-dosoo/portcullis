[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portcullis"
version = "0.0.0"
description = "A self-hosted gateway for Model Context Protocol servers"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { text = "Apache-2.0" }
authors = [
  { name = "DOSOO WISDOM" },
]
dependencies = [
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "asyncpg>=0.29",
  "authlib>=1.3",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=1",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "prometheus-client>=0.20",
  "pydantic-settings>=2",
  "redis[hiredis]>=5",
  "sqlalchemy[asyncio]>=2",
  "structlog>=24",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
portcullis = "app.cli:main"

[project.optional-dependencies]
dev = [
  "hypothesis>=6",
  "locust>=2.31",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.7",
  "testcontainers[postgres,redis]>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
