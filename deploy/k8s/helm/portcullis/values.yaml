# Default values for portcullis Helm chart

replicaCount: 2

image:
  repository: ghcr.io/wisdom-dosoo/portcullis
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations:
    prometheus.io/scrape: "true"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: portcullis.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: portcullis-tls
      hosts:
        - portcullis.example.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - portcullis
          topologyKey: kubernetes.io/hostname

# Application configuration
config:
  environment: production
  logLevel: INFO
  corsAllowedOrigins: "https://portcullis.example.com"
  upstreamAllowedHosts: "localhost,127.0.0.1"
  upstreamConnectTimeoutSeconds: 5.0
  upstreamReadTimeoutSeconds: 30.0
  healthCheckIntervalSeconds: 30.0
  healthCheckFailureThreshold: 3
  rateLimitDefault: "100/minute"
  authRateLimitDefault: "20/minute"
  managementApiRateLimitDefault: "100/minute"
  maxRequestBodyBytes: 1048576
  mcpAllowedOrigins: "https://claude.ai,https://cursor.sh"
  usageEnforcementEnabled: false
  telemetryEnabled: false
  metricsEnabled: true

# Redis configuration
redis:
  mode: sentinel  # standalone, sentinel, cluster
  url: "redis://redis-master:6379/0"
  sentinelMaster: "mymaster"
  sentinelHosts: "redis-sentinel:26379"
  maxConnections: 50
  socketTimeoutSeconds: 5.0
  socketConnectTimeoutSeconds: 5.0

# PostgreSQL configuration
postgresql:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
  readReplicas:
    enabled: true
    replicaCount: 1
    persistence:
      enabled: true
      size: 10Gi
  pgbouncer:
    enabled: true
    poolMode: transaction
    maxClientConn: 1000
    defaultPoolSize: 25
    minPoolSize: 5
    maxDbConnections: 100

# External database (alternative to postgresql.enabled)
externalDatabase:
  enabled: false
  host: ""
  port: 5432
  database: "portcullis"
  username: "portcullis"
  password: ""
  sslMode: "require"

# Redis (external or internal)
redisExternal:
  enabled: false
  host: ""
  port: 6379
  password: ""
  db: 0
  sentinelMaster: ""
  sentinelHosts: ""
  useSSL: false

# Secrets (should be provided via external secret management)
secrets:
  apiKeyPepper: ""
  jwtJwksUrl: ""
  jwtIssuer: ""
  jwtAudience: "portcullis"
  ssoOidcClientSecret: ""

# Health checks
healthChecks:
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Monitoring
monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  prometheusRules:
    enabled: true

# Backup
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retentionDays: 30
  storage:
    type: s3  # s3, gcs, azure
    bucket: "portcullis-backups"
    prefix: "postgres"
    region: "us-east-1"
    credentialsSecret: "backup-credentials"

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1