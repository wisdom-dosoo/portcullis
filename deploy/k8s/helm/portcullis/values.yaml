# Default values for portcullis Helm chart

replicaCount: 2

image:
  repository: ghcr.io/wisdom-dosoo/portcullis
  pullPolicy: IfNotPresent
  # Ship-checklist: empty = Chart.AppVersion (pinned release tag, e.g. 0.8.0).
  # Never ship "latest" to production — it is not immutable and breaks
  # rollbacks. Release CI tags :<version> + :<sha>; pin one of those here.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # P1: must match Dockerfile `useradd -r portcullis` (UID 999), not 1000.
  runAsUser: 999
  fsGroup: 999

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations:
    prometheus.io/scrape: "true"

# Ship-checklist: cert-manager TLS automation. Enabled by default — override
# hosts/issuer for your domain (the yourdomain.com placeholders fail closed in
# CI lint if left unchanged; see NOTES.txt).
tls:
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: letsencrypt-prod
    secretName: ""

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: portcullis.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: portcullis-tls
      hosts:
        - portcullis.yourdomain.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - portcullis
          topologyKey: kubernetes.io/hostname

# P2: spread replicas across zones/hosts (no-op on single-node kind/k3d).
topologySpreadConstraints: []

# Application configuration
config:
  environment: production
  logLevel: INFO
  # Ship-checklist: ingress/LB CIDRs trusted for X-Forwarded-For. `*` is
  # rejected in production (see config.py) — set your NLB/ingress ranges.
  forwardedAllowIps: "10.0.0.0/8"
  corsAllowedOrigins: "https://portcullis.yourdomain.com"
  upstreamAllowedHosts: "localhost,127.0.0.1"
  upstreamConnectTimeoutSeconds: 5.0
  upstreamReadTimeoutSeconds: 30.0
  healthCheckIntervalSeconds: 30.0
  healthCheckFailureThreshold: 3
  rateLimitDefault: "100/minute"
  authRateLimitDefault: "20/minute"
  managementApiRateLimitDefault: "100/minute"
  maxRequestBodyBytes: 1048576
  mcpAllowedOrigins: "https://claude.ai,https://cursor.sh"
  usageEnforcementEnabled: false
  telemetryEnabled: false
  metricsEnabled: true

# Redis configuration (Bitnami subchart; see Chart.yaml condition redis.enabled)
redis:
  enabled: true
  mode: sentinel  # standalone, sentinel, cluster
  url: "redis://redis-master:6379/0"
  sentinelMaster: "mymaster"
  sentinelHosts: "redis-sentinel:26379"
  maxConnections: 50
  socketTimeoutSeconds: 5.0
  socketConnectTimeoutSeconds: 5.0

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    # P1: required by templates/secret.yaml DATABASE_URL rendering.
    # Provide via --set or external secret; never commit real passwords.
    username: portcullis
    password: ""
    database: portcullis
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
  readReplicas:
    enabled: true
    replicaCount: 1
    persistence:
      enabled: true
      size: 10Gi
  pgbouncer:
    enabled: true
    poolMode: transaction
    maxClientConn: 1000
    defaultPoolSize: 25
    minPoolSize: 5
    maxDbConnections: 100

# External database (alternative to postgresql.enabled)
externalDatabase:
  enabled: false
  host: ""
  port: 5432
  database: "portcullis"
  username: "portcullis"
  password: ""
  sslMode: "require"

# Redis (external or internal)
redisExternal:
  enabled: false
  host: ""
  port: 6379
  password: ""
  db: 0
  sentinelMaster: ""
  sentinelHosts: ""
  useSSL: false

# Secrets (should be provided via external secret management in production)
# Option 1: Set values directly (NOT recommended for production — visible in Helm release history)
# Option 2: Set secrets.existingSecret to the name of a pre-existing Kubernetes Secret
secrets:
  existingSecret: ""  # Name of an existing Secret to reference (keys must match below)
  apiKeyPepper: ""
  jwtJwksUrl: ""
  jwtIssuer: ""
  jwtAudience: "portcullis"
  ssoOidcClientSecret: ""
  # Ship-checklist: gate /metrics with `Authorization: Bearer <token>`.
  # Empty preserves legacy network-restricted behavior — set in production.
  metricsAuthToken: ""
  # Ship-checklist: direct (non-PgBouncer) DB URL for the migrate Job.
  # Required when postgresql.pgbouncer is enabled; advisory locks do not
  # survive transaction pooling. Same format as DATABASE_URL.
  databaseDirectUrl: ""

# Schema migrations — PgBouncer-safe.
# When enabled, app pods skip in-pod Alembic (SKIP_MIGRATIONS=1) and a
# pre-upgrade Helm Job migrates once against the direct DB URL.
migration:
  enabled: true
  skipInPods: "1"
  backoffLimit: 3
  activeDeadlineSeconds: 300

# Audit log lifecycle.
audit:
  retentionDays: 400
  # DLQ spill file inside the container when Postgres is down (see
  # app/observability/audit.py). Survives pod restarts via the emptyDir below
  # for the pod lifetime; ship to object storage with your log agent.
  dlqPath: "/var/run/portcullis-audit-dlq.jsonl"

# Health checks
healthChecks:
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Monitoring
monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  prometheusRules:
    enabled: true
  # Ship-checklist: alerts must page somebody. Point at your Alertmanager
  # receiver; see docs/operations/load-baseline.md. Unset = alerts fire
  # into the void.
  alertRouting:
    enabled: false
    receiver: "pagerduty-portcullis"
    criticalRepeatInterval: 5m
    warningRepeatInterval: 30m

# Backup
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retentionDays: 30
  storage:
    type: s3  # s3, gcs, azure
    bucket: "portcullis-backups"
    prefix: "postgres"
    region: "us-east-1"
    credentialsSecret: "backup-credentials"

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  # P2: appended verbatim to the default egress rules (DNS/Postgres/Redis/443).
  egressExtra: []

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Frontend dashboard (Next.js standalone, see web/Dockerfile).
# Ship-checklist: web previously had no production artifact — it does now.
web:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/wisdom-dosoo/portcullis-web
    pullPolicy: IfNotPresent
    # Empty = Chart.AppVersion (pinned release tag). Never "latest" in prod.
    tag: ""
  apiUrl: "https://portcullis.yourdomain.com"
  resources:
    limits: { cpu: 500m, memory: 512Mi }
    requests: { cpu: 100m, memory: 128Mi }
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: dashboard.yourdomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: portcullis-web-tls
        hosts:
          - dashboard.yourdomain.com