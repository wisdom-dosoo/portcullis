apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "portcullis.fullname" . }}-config
  labels:
    {{- include "portcullis.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  UPSTREAM_ALLOWED_HOSTS: {{ .Values.config.upstreamAllowedHosts | quote }}
  UPSTREAM_CONNECT_TIMEOUT_SECONDS: {{ .Values.config.upstreamConnectTimeoutSeconds | quote }}
  UPSTREAM_READ_TIMEOUT_SECONDS: {{ .Values.config.upstreamReadTimeoutSeconds | quote }}
  HEALTH_CHECK_INTERVAL_SECONDS: {{ .Values.config.healthCheckIntervalSeconds | quote }}
  HEALTH_CHECK_FAILURE_THRESHOLD: {{ .Values.config.healthCheckFailureThreshold | quote }}
  RATE_LIMIT_DEFAULT: {{ .Values.config.rateLimitDefault | quote }}
  AUTH_RATE_LIMIT_DEFAULT: {{ .Values.config.authRateLimitDefault | quote }}
  MANAGEMENT_API_RATE_LIMIT_DEFAULT: {{ .Values.config.managementApiRateLimitDefault | quote }}
  MAX_REQUEST_BODY_BYTES: {{ .Values.config.maxRequestBodyBytes | quote }}
  MCP_ALLOWED_ORIGINS: {{ .Values.config.mcpAllowedOrigins | quote }}
  FORWARDED_ALLOW_IPS: {{ .Values.config.forwardedAllowIps | quote }}
  SKIP_MIGRATIONS: {{ .Values.migration.skipInPods | quote }}
  AUDIT_RETENTION_DAYS: {{ .Values.audit.retentionDays | quote }}
  AUDIT_DLQ_PATH: {{ .Values.audit.dlqPath | quote }}
  USAGE_ENFORCEMENT_ENABLED: {{ .Values.config.usageEnforcementEnabled | quote }}
  TELEMETRY_ENABLED: {{ .Values.config.telemetryEnabled | quote }}
  METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  # P1: REDIS_URL lives only in the Secret (single source of truth). It was
  # previously defined in both ConfigMap and Secret with disagreeing defaults.
  REDIS_MODE: {{ .Values.redis.mode | quote }}
  REDIS_SENTINEL_MASTER: {{ .Values.redis.sentinelMaster | quote }}
  REDIS_SENTINEL_HOSTS: {{ .Values.redis.sentinelHosts | quote }}
  REDIS_MAX_CONNECTIONS: {{ .Values.redis.maxConnections | quote }}
  REDIS_SOCKET_TIMEOUT_SECONDS: {{ .Values.redis.socketTimeoutSeconds | quote }}
  REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: {{ .Values.redis.socketConnectTimeoutSeconds | quote }}
  DB_PGBOUNCER: {{ .Values.postgresql.pgbouncer.enabled | quote }}