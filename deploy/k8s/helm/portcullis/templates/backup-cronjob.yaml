{{- if and .Values.backup.enabled (or .Values.postgresql.enabled .Values.externalDatabase.enabled) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "portcullis.fullname" . }}-backup
  labels:
    {{- include "portcullis.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "portcullis.serviceAccountName" . }}
          containers:
            - name: backup
              # P1: postgres:16-alpine has pg_dump but no `aws` CLI, and its
              # BusyBox `date` lacks GNU `-d`. Install aws-cli via apk and rely
              # on S3 bucket lifecycle for retention (no GNU-date cleanup).
              # P2: supports externalDatabase (host/port/db/user from values,
              # password via existingSecret key DB_PASSWORD when set).
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  {{- if .Values.externalDatabase.enabled }}
                  value: {{ .Values.externalDatabase.host | quote }}
                  {{- else if .Values.postgresql.pgbouncer.enabled }}
                  value: proxy
                  {{- else }}
                  value: {{ include "portcullis.postgresql.fullname" . }}
                  {{- end }}
                - name: PGPORT
                  value: {{ (.Values.externalDatabase.port | default 5432) | quote }}
                - name: PGDATABASE
                  value: {{ .Values.externalDatabase.database | default "portcullis" | quote }}
                - name: PGUSER
                  {{- if .Values.externalDatabase.enabled }}
                  value: {{ .Values.externalDatabase.username | quote }}
                  {{- else }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "portcullis.postgresql.fullname" . }}
                      key: postgres-password
                  {{- end }}
                {{- if and .Values.externalDatabase.enabled .Values.secrets.existingSecret }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret }}
                      key: DB_PASSWORD
                      optional: true
                {{- end }}
                - name: BACKUP_BUCKET
                  value: {{ .Values.backup.storage.bucket }}
                - name: BACKUP_PREFIX
                  value: {{ .Values.backup.storage.prefix }}
                - name: BACKUP_REGION
                  value: {{ .Values.backup.storage.region }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.storage.credentialsSecret }}
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.storage.credentialsSecret }}
                      key: secret-access-key
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  apk add --no-cache aws-cli >/dev/null
                  DATE=$(date +%Y%m%d_%H%M%S)
                  FILE="portcullis_${DATE}.sql.gz"
                  echo "Starting backup to s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/${FILE}"
                  pg_dump --no-owner --no-acl | gzip | aws s3 cp - s3://${BACKUP_BUCKET}/${BACKUP_PREFIX}/${FILE}
                  echo "Backup completed: ${FILE}"
                  echo "Retention is enforced by the S3 bucket lifecycle policy (see values backup.retentionDays)."
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
{{- end }}