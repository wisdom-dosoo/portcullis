apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portcullis.fullname" . }}-secrets
  labels:
    {{- include "portcullis.labels" . | nindent 4 }}
  {{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.apiKeyPepper) }}
  {{- fail "secrets.apiKeyPepper or secrets.existingSecret is required (pepper must not be empty)" }}
  {{- end }}
type: Opaque
data:
  {{- if .Values.secrets.existingSecret }}
  {{- /* Use an existing Secret — keys are copied from the referenced secret */ -}}
  {{- else }}
  {{- if .Values.secrets.apiKeyPepper }}
  API_KEY_PEPPER: {{ .Values.secrets.apiKeyPepper | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtJwksUrl }}
  JWT_JWKS_URL: {{ .Values.secrets.jwtJwksUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtIssuer }}
  JWT_ISSUER: {{ .Values.secrets.jwtIssuer | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtAudience }}
  JWT_AUDIENCE: {{ .Values.secrets.jwtAudience | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.ssoOidcClientSecret }}
  SSO_OIDC_CLIENT_SECRET: {{ .Values.secrets.ssoOidcClientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.metricsAuthToken }}
  METRICS_AUTH_TOKEN: {{ .Values.secrets.metricsAuthToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseDirectUrl }}
  DATABASE_URL_DIRECT: {{ .Values.secrets.databaseDirectUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.externalDatabase.enabled }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:%d/%s?sslmode=%s" .Values.externalDatabase.username .Values.externalDatabase.password .Values.externalDatabase.host (int .Values.externalDatabase.port) .Values.externalDatabase.database .Values.externalDatabase.sslMode | b64enc | quote }}
  {{- else if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://portcullis:%s@%s:5432/portcullis" .Values.postgresql.auth.password (include "portcullis.postgresql.fullname" .) | b64enc | quote }}
  {{- end }}
  {{- if .Values.redisExternal.enabled }}
  REDIS_URL: {{ printf "redis%s://%s%s:%d/%d" (ternary "s" "" .Values.redisExternal.useSSL) (ternary (printf ":%s@" .Values.redisExternal.password) "" (.Values.redisExternal.password | not)) .Values.redisExternal.host (int .Values.redisExternal.port) (int .Values.redisExternal.db) | b64enc | quote }}
  {{- else if .Values.redis.mode == "sentinel" }}
  REDIS_URL: {{ printf "redis://%s:6379/0" .Values.redis.sentinelMaster | b64enc | quote }}
  {{- else if .Values.redis.mode == "cluster" }}
  REDIS_URL: {{ printf "redis://%s:6379/0" (include "portcullis.redis.fullname" .) | b64enc | quote }}
  {{- else }}
  REDIS_URL: {{ printf "redis://%s:6379/0" (include "portcullis.redis.fullname" .) | b64enc | quote }}
  {{- end }}
  {{- end }}
