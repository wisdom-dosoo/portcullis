{{- if .Values.migration.enabled }}
# Ship-checklist: PgBouncer-safe migrations. Runs once per `helm upgrade`
# (helm.sh/hook: pre-upgrade) against DATABASE_URL_DIRECT — a direct,
# non-pooled connection that can hold pg_advisory_lock. App pods set
# SKIP_MIGRATIONS=1 and never migrate concurrently.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "portcullis.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "portcullis.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "portcullis.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "portcullis.fullname" . }}-config
            {{- if .Values.secrets.existingSecret }}
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
            {{- else }}
            - secretRef:
                name: {{ include "portcullis.fullname" . }}-secrets
            {{- end }}
          env:
            # Prefer the direct URL when present; entrypoint falls back to
            # DATABASE_URL for non-PgBouncer installs.
            - name: DATABASE_URL_DIRECT
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secrets.existingSecret }}
                  name: {{ .Values.secrets.existingSecret }}
                  {{- else }}
                  name: {{ include "portcullis.fullname" . }}-secrets
                  {{- end }}
                  key: DATABASE_URL_DIRECT
                  optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
