{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "portcullis.fullname" . }}-web
  labels:
    {{- include "portcullis.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "portcullis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
